name: c_drive_manager
description: "C 盘管家 Windows desktop client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Local copy of the brand mark keeps the desktop Flutter package self-contained.
    - assets/images/logo.png
    # Flutter 仅包含目录直属文件，切图按子目录逐项声明。
    - assets/ui/common/
    - assets/ui/nav/
    - assets/ui/cleanup/
    - assets/ui/migration/
    - assets/ui/wechat/
    - assets/ui/system/
    - assets/ui/quarantine/
    - assets/ui/settings/
